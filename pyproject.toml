[project]
name = "kdocs-mcp"
version = "1.4.0"
description = "MCP server that generates KDU EE lab reports, CA reports and assignments as styled Word documents"
readme = "README.md"
authors = [
    { name = "KDocs MCP contributors" }
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.3",
    "mcp[cli]>=1.9",
    "pillow>=13.0.0",
    "pypandoc-binary>=1.17",
    "python-docx>=1.2.0",
    "pywin32>=306; sys_platform == 'win32'",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "schemdraw>=0.23",
    "pypdf>=6.21.2",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
    "pyspellchecker>=0.9.1",
    "httpx>=0.28.1",
]

[project.scripts]
kdocs-mcp = "kdocs_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
