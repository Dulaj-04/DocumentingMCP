[project]
name = "documenting-mcp"
version = "0.1.0"
description = "MCP server that generates KDU EE lab reports, CA reports and assignments as styled Word documents"
readme = "README.md"
authors = [
    { name = "Dulaj Wickramanayake" }
]
requires-python = ">=3.11"
dependencies = [
    "lxml>=6.1.3",
    "mcp[cli]>=1.9",
    "pillow>=13.0.0",
    "pypandoc-binary>=1.17",
    "python-docx>=1.2.0",
    "docx2pdf>=0.1.8; sys_platform == 'win32'",
]

[project.scripts]
documenting-mcp = "documenting_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
